<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Oncloud 사용 장비</title>
<style>
  :root{
    --bg:#F7F6F2; --surface:#FFFFFF; --line:#E4E1D8; --line-strong:#CFCBBC;
    --text:#2A2A26; --text-2:#6B6A62; --text-3:#9A988C;
    --accent:#185FA5; --accent-bg:#E6F1FB;
    --qa:#0F6E56; --qa-bg:#E1F5EE;
    --stg:#854F0B; --stg-bg:#FAEEDA;
    --prod:#A32D2D; --prod-bg:#FCEBEB;
    --none:#5F5E5A; --none-bg:#F1EFE8;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    padding:28px 20px 60px;}
  .wrap{max-width:1560px;margin:0 auto;}
  h1{font-size:20px;font-weight:600;margin:0 0 2px;}
  .sub{color:var(--text-2);font-size:13px;margin:0 0 20px;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .stat .n{font-size:22px;font-weight:600;line-height:1.2;}
  .stat .l{font-size:12px;color:var(--text-2);margin-top:2px;}
  .stat.qa .n{color:var(--qa);} .stat.stg .n{color:var(--stg);}
  .stat.prod .n{color:var(--prod);} .stat.none .n{color:var(--none);}

  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .search{flex:1;min-width:220px;height:38px;border:1px solid var(--line-strong);border-radius:8px;
    padding:0 12px;font-size:14px;background:#fff;}
  .search:focus{outline:none;border-color:var(--accent);}
  .chip{border:1px solid var(--line-strong);background:#fff;border-radius:20px;padding:7px 14px;
    font-size:13.5px;cursor:pointer;color:var(--text-2);user-select:none;white-space:nowrap;}
  .chip.active{background:var(--text);color:#fff;border-color:var(--text);}
  .chip[data-env="QA"].active{background:var(--qa);border-color:var(--qa);}
  .chip[data-env="STG"].active{background:var(--stg);border-color:var(--stg);}
  .chip[data-env="Prod"].active{background:var(--prod);border-color:var(--prod);}
  .sel{height:38px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;
    font-size:13.5px;padding:0 10px;color:var(--text);}
  .count{font-size:13px;color:var(--text-3);margin-left:auto;white-space:nowrap;}

  .tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;}
  table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:1300px;}
  thead th{position:sticky;top:0;background:#FAF9F5;border-bottom:1px solid var(--line-strong);
    text-align:left;padding:12px 12px;font-weight:600;color:var(--text-2);cursor:pointer;white-space:nowrap;}
  thead th:hover{color:var(--text);}
  thead th .arrow{font-size:10px;opacity:.5;margin-left:3px;}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:hover{background:#FAFAF7;}
  tbody tr:last-child td{border-bottom:none;}
  td.dev{font-weight:600;font-family:var(--mono);white-space:normal;word-break:break-all;overflow-wrap:anywhere;max-width:calc(11ch + 24px);line-height:1.45;}
  td.mono{font-family:var(--mono);font-size:13px;color:var(--text-2);white-space:nowrap;}
  td.mono.serial{white-space:normal;word-break:break-all;overflow-wrap:anywhere;max-width:calc(15ch + 24px);line-height:1.45;}
  td.mono.mac{white-space:normal;word-break:break-all;overflow-wrap:anywhere;max-width:calc(17ch + 24px);line-height:1.45;}
  td.cmt{color:var(--text-2);max-width:320px;font-size:13.5px;line-height:1.6;}
  td.acct{font-size:13px;color:var(--text-2);white-space:nowrap;}
  .badge{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .badge.QA{background:var(--qa-bg);color:var(--qa);}
  .badge.STG{background:var(--stg-bg);color:var(--stg);}
  .badge.Prod{background:var(--prod-bg);color:var(--prod);}
  .badge.none{background:var(--none-bg);color:var(--none);}
  .empty{padding:40px;text-align:center;color:var(--text-3);font-size:13px;}
  .hl{background:#FDE68A;border-radius:2px;}
  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;}

  .btn{height:34px;border:1px solid var(--line-strong);background:#fff;border-radius:8px;
    padding:0 12px;font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap;}
  .btn:hover{background:#FAFAF7;}
  .btn.primary{background:var(--text);color:#fff;border-color:var(--text);}
  .btn.primary:hover{opacity:.9;}
  .btn.danger-outline{color:var(--prod);border-color:var(--prod-bg);}
  td.delcol{width:52px;padding:8px 6px;white-space:nowrap;}
  .delbtn,.editbtn,.savebtn,.cancelbtn{width:20px;height:20px;border:none;background:none;color:var(--text-3);
    cursor:pointer;font-size:13px;border-radius:4px;line-height:1;}
  .delbtn:hover{background:var(--prod-bg);color:var(--prod);}
  .editbtn:hover{background:var(--accent-bg);color:var(--accent);}
  .savebtn{color:var(--qa);width:auto;padding:0 6px;font-size:11.5px;font-weight:600;}
  .savebtn:hover{background:var(--qa-bg);}
  .cancelbtn{width:auto;padding:0 6px;font-size:11.5px;}
  .cancelbtn:hover{background:var(--none-bg);}
  th.delcol{width:52px;}
  tr.editing td{background:var(--accent-bg);}
  .editin{width:100%;min-width:60px;height:26px;border:1px solid var(--line-strong);border-radius:5px;
    padding:0 6px;font-size:12px;background:#fff;box-sizing:border-box;}
  .editin:focus{outline:none;border-color:var(--accent);}
  select.editin{padding:0 2px;}

  .modal-bg{position:static;display:none;margin-bottom:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:16px;}
  .modal-bg.open{display:block;}
  .modal-title{font-size:14px;font-weight:600;margin:0 0 12px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px;}
  .form-field label{display:block;font-size:11.5px;color:var(--text-2);margin-bottom:4px;}
  .form-field input,.form-field select{width:100%;height:32px;border:1px solid var(--line-strong);
    border-radius:6px;padding:0 8px;font-size:12.5px;background:#fff;}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;}
  .err{color:var(--prod);font-size:12px;margin:0 0 10px;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Oncloud 사용 장비</h1>
  <p class="sub">Cloud 과제 Device 정보 &middot; 총 98개 장비 &middot; 검색 / 필터 / 정렬 가능</p>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input class="search" id="search" placeholder="Device, IP, Serial, Mac, Account, ORG ID, Short name, 비고 검색...">
    <span class="chip active" data-env="ALL">전체</span>
    <span class="chip" data-env="QA">QA</span>
    <span class="chip" data-env="STG">STG</span>
    <span class="chip" data-env="Prod">Prod</span>
    <span class="chip" data-env="NONE">미배정</span>
    <select class="sel" id="socSel"><option value="ALL">전체 Platform</option></select>
    <select class="sel" id="compatSel">
      <option value="ALL">호환성 전체</option>
      <option value="Y">호환 O</option>
      <option value="N">호환 X</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div class="controls">
    <button class="btn primary" id="addBtn">+ 장비 추가</button>
    <span class="count" style="margin-left:auto;">변경사항은 클라우드에 실시간 저장되며 접속한 모든 사용자에게 공유됩니다.</span>
  </div>

  <div class="modal-bg" id="addForm">
    <p class="modal-title">새 장비 추가</p>
    <p class="err" id="formErr">Device 이름은 필수입니다.</p>
    <div class="form-grid">
      <div class="form-field"><label>Device *</label><input id="f_device" placeholder="예: XNV-6083RZ"></div>
      <div class="form-field"><label>호환성</label>
        <label style="display:flex;align-items:center;height:34px;"><input type="checkbox" id="f_compat" style="width:16px;height:16px;margin:0;"></label>
      </div>
      <div class="form-field"><label>Platform</label>
        <select id="f_soc">
          <option value="">미지정</option>
          <option value="WN7">WN7</option>
          <option value="WN8">WN8</option>
          <option value="WN9">WN9</option>
          <option value="Q AI">Q AI</option>
          <option value="P AI">P AI</option>
          <option value="CV2">CV2</option>
          <option value="CV5">CV5</option>
          <option value="NOVATEK">NOVATEK</option>
        </select>
      </div>
      <div class="form-field"><label>환경</label>
        <select id="f_env"><option value="">미배정</option><option value="QA">QA</option><option value="STG">STG</option><option value="Prod">Prod</option></select>
      </div>
      <div class="form-field"><label>IP</label><input id="f_ip" placeholder="172.30.1.x"></div>
      <div class="form-field"><label>Serial</label><input id="f_serial"></div>
      <div class="form-field"><label>Mac</label><input id="f_mac"></div>
      <div class="form-field"><label>Account</label><input id="f_account"></div>
      <div class="form-field"><label>ORG ID</label><input id="f_orgid"></div>
      <div class="form-field"><label>Short name</label><input id="f_sname"></div>
      <div class="form-field" style="grid-column:1/-1;"><label>비고</label><input id="f_comment"></div>
    </div>
    <div class="form-actions">
      <button class="btn" id="cancelAdd">취소</button>
      <button class="btn primary" id="submitAdd">추가</button>
    </div>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th class="delcol"></th>
          <th data-k="device">Device<span class="arrow"></span></th>
          <th style="text-align:center;">호환성</th>
          <th data-k="soc">Platform<span class="arrow"></span></th>
          <th data-k="env">환경<span class="arrow"></span></th>
          <th data-k="ip">IP<span class="arrow"></span></th>
          <th data-k="serial">Serial<span class="arrow"></span></th>
          <th data-k="mac">Mac<span class="arrow"></span></th>
          <th data-k="account">Account<span class="arrow"></span></th>
          <th data-k="orgid">ORG ID<span class="arrow"></span></th>
          <th data-k="sname">Short name<span class="arrow"></span></th>
          <th data-k="comment">비고<span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:block;">데이터를 불러오는 중...</div>
  </div>
</div>

const RAW_KEYS=["device","soc","env","slot","ip","serial","mac","shortname","camtype","comment"];
const INITIAL_ROWS = DATA.map(r=>{
  const raw=Object.fromEntries(RAW_KEYS.map((k,i)=>[k,r[i]||""]));
  return {
    device: raw.device,
    compat: false,
    soc: raw.soc,
    env: raw.env,
    ip: raw.ip,
    serial: raw.serial,
    mac: raw.mac,
    account: "",
    orgid: "",
    sname: "",
    comment: raw.comment
  };
});

let rows = [];

async function seedIfEmpty(){
  const snap = await getDocs(devicesCol);
  if(!snap.empty) return;
  const batch = writeBatch(db);
  INITIAL_ROWS.forEach(r=>{
    const ref = doc(devicesCol);
    batch.set(ref, r);
  });
  await batch.commit();
}

const tbody=document.getElementById('tbody');
const empty=document.getElementById('empty');
const countEl=document.getElementById('count');
const searchEl=document.getElementById('search');
const socSel=document.getElementById('socSel');
const compatSel=document.getElementById('compatSel');
let envFilter='ALL', sortKey='device', sortDir=1, editingId=null;

function populateSocOptions(){
  const current = socSel.value;
  socSel.innerHTML = '<option value="ALL">전체 Platform</option>';
  const socs=[...new Set(rows.map(r=>r.soc).filter(Boolean))].sort();
  socs.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;socSel.appendChild(o);});
  if([...socSel.options].some(o=>o.value===current)) socSel.value=current;
}

function renderStats(){
  const c={QA:0,STG:0,Prod:0,NONE:0};
  rows.forEach(r=>{ if(r.env==='QA')c.QA++; else if(r.env==='STG')c.STG++; else if(r.env==='Prod')c.Prod++; else c.NONE++; });
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${rows.length}</div><div class="l">전체 장비</div></div>
    <div class="stat qa"><div class="n">${c.QA}</div><div class="l">QA</div></div>
    <div class="stat stg"><div class="n">${c.STG}</div><div class="l">STG</div></div>
    <div class="stat prod"><div class="n">${c.Prod}</div><div class="l">Prod</div></div>
    <div class="stat none"><div class="n">${c.NONE}</div><div class="l">환경 미배정</div></div>
  `;
}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(text,q){
  if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<span class="hl">'+esc(text.slice(i,i+q.length))+'</span>'+esc(text.slice(i+q.length));
}

function badge(env){
  if(!env) return '<span class="badge none">미배정</span>';
  return `<span class="badge ${env}">${env}</span>`;
}

function render(){
  const q=searchEl.value.trim();
  const qLower=q.toLowerCase();
  const soc=socSel.value;
  const compatF=compatSel.value;
  let filtered=rows.filter(r=>{
    if(envFilter==='NONE' && r.env!=='') return false;
    if(envFilter!=='ALL' && envFilter!=='NONE' && r.env!==envFilter) return false;
    if(soc!=='ALL' && r.soc!==soc) return false;
    if(compatF==='Y' && !r.compat) return false;
    if(compatF==='N' && r.compat) return false;
    if(q){
      const hay=[r.device,r.soc,r.ip,r.serial,r.mac,r.account,r.orgid,r.sname,r.comment].join(' ').toLowerCase();
      if(!hay.includes(qLower)) return false;
    }
    return true;
  });
  filtered.sort((a,b)=>{
    const av=a[sortKey]||'', bv=b[sortKey]||'';
    return av.localeCompare(bv,'ko')*sortDir;
  });
  countEl.textContent = filtered.length+' / '+rows.length+'개 표시';
  if(filtered.length===0){ tbody.innerHTML=''; empty.textContent='검색 결과가 없습니다.'; empty.style.display='block'; return; }
  empty.style.display='none';
  tbody.innerHTML = filtered.map(r=>{
    if(r._id===editingId) return editRowHtml(r);
    return `
    <tr>
      <td class="delcol">
        <button class="editbtn" data-id="${r._id}" aria-label="수정" title="수정">&#9998;</button>
        <button class="delbtn" data-id="${r._id}" aria-label="삭제" title="삭제">&times;</button>
      </td>
      <td class="dev">${hl(r.device,q)}</td>
      <td style="text-align:center;"><input type="checkbox" class="compatchk" data-id="${r._id}" ${r.compat?'checked':''}></td>
      <td>${esc(r.soc)}</td>
      <td>${badge(r.env)}</td>
      <td class="mono">${hl(r.ip,q)}</td>
      <td class="mono serial">${hl(r.serial,q)}</td>
      <td class="mono mac">${hl(r.mac,q)}</td>
      <td class="acct">${hl(r.account||'',q)}</td>
      <td>${hl(r.orgid||'',q)}</td>
      <td>${hl(r.sname||'',q)}</td>
      <td class="cmt">${hl(r.comment,q)}</td>
    </tr>
  `;
  }).join('');
  tbody.querySelectorAll('.editbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      editingId=btn.dataset.id;
      render();
    });
  });
  tbody.querySelectorAll('.cancelbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      editingId=null;
      render();
    });
  });
  tbody.querySelectorAll('.savebtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.id;
      const tr=btn.closest('tr');
      const get=name=>tr.querySelector(`[name="${name}"]`).value.trim();
      const updated={
        device:get('device'), soc:get('soc'), env:get('env'),
        ip:get('ip'), serial:get('serial'), mac:get('mac'),
        account:get('account'), orgid:get('orgid'), sname:get('sname'),
        comment:get('comment'), compat:tr.querySelector('[name="compat"]').checked
      };
      if(!updated.device){ alert('Device 이름은 필수입니다.'); return; }
      btn.disabled=true;
      updateDoc(doc(db,'devices',id), updated).then(()=>{
        editingId=null;
        render();
      }).catch(err=>{
        alert('수정 실패: '+err.message);
        btn.disabled=false;
      });
    });
  });
  tbody.querySelectorAll('.compatchk').forEach(chk=>{
    chk.addEventListener('change',()=>{
      const id=chk.dataset.id;
      chk.disabled=true;
      updateDoc(doc(db,'devices',id), {compat:chk.checked}).catch(err=>{
        alert('호환성 변경 실패: '+err.message);
        chk.checked=!chk.checked;
      }).finally(()=>{ chk.disabled=false; });
    });
  });
  tbody.querySelectorAll('.delbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.id;
      const row=rows.find(x=>x._id===id);
      if(row && confirm(`"${row.device||'이 장비'}" 항목을 삭제할까요?`)){
        btn.disabled=true;
        deleteDoc(doc(db,'devices',id)).catch(err=>{
          alert('삭제 실패: '+err.message);
          btn.disabled=false;
        });
      }
    });
  });
}

const PLATFORM_OPTIONS=["WN7","WN8","WN9","Q AI","P AI","CV2","CV5","NOVATEK"];
function platformOptions(current){
  const opts=['']
    .concat(PLATFORM_OPTIONS)
    .concat((current && !PLATFORM_OPTIONS.includes(current)) ? [current] : []);
  return opts.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${v===''?'미지정':esc(v)}</option>`).join('');
}

function envOptions(current){
  return ['','QA','STG','Prod'].map(v=>
    `<option value="${v}" ${v===current?'selected':''}>${v===''?'미배정':v}</option>`
  ).join('');
}

function editRowHtml(r){
  return `
    <tr class="editing">
      <td class="delcol">
        <button class="savebtn" data-id="${r._id}" title="저장">저장</button>
        <button class="cancelbtn" title="취소">취소</button>
      </td>
      <td><input class="editin" name="device" value="${esc(r.device||'')}"></td>
      <td style="text-align:center;"><input type="checkbox" name="compat" ${r.compat?'checked':''}></td>
      <td><select class="editin" name="soc">${platformOptions(r.soc||'')}</select></td>
      <td><select class="editin" name="env">${envOptions(r.env||'')}</select></td>
      <td><input class="editin" name="ip" value="${esc(r.ip||'')}"></td>
      <td><input class="editin" name="serial" value="${esc(r.serial||'')}"></td>
      <td><input class="editin" name="mac" value="${esc(r.mac||'')}"></td>
      <td><input class="editin" name="account" value="${esc(r.account||'')}"></td>
      <td><input class="editin" name="orgid" value="${esc(r.orgid||'')}"></td>
      <td><input class="editin" name="sname" value="${esc(r.sname||'')}"></td>
      <td><input class="editin" name="comment" value="${esc(r.comment||'')}"></td>
    </tr>
  `;
}

searchEl.addEventListener('input',render);
socSel.addEventListener('change',render);
compatSel.addEventListener('change',render);
document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    envFilter=chip.dataset.env;
    render();
  });
});
document.querySelectorAll('thead th[data-k]').forEach(th=>{
  th.addEventListener('click',()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=1; }
    document.querySelectorAll('thead th .arrow').forEach(a=>a.textContent='');
    th.querySelector('.arrow').textContent = sortDir===1?'▲':'▼';
    render();
  });
});

const addForm=document.getElementById('addForm');
const formErr=document.getElementById('formErr');
document.getElementById('addBtn').addEventListener('click',()=>{
  addForm.classList.add('open');
  formErr.style.display='none';
});
document.getElementById('cancelAdd').addEventListener('click',()=>{
  addForm.classList.remove('open');
});
document.getElementById('submitAdd').addEventListener('click',async()=>{
  const device=document.getElementById('f_device').value.trim();
  if(!device){
    formErr.style.display='block';
    document.getElementById('f_device').focus();
    return;
  }
  formErr.style.display='none';
  const newRow={
    device,
    compat:document.getElementById('f_compat').checked,
    soc:document.getElementById('f_soc').value.trim(),
    env:document.getElementById('f_env').value,
    ip:document.getElementById('f_ip').value.trim(),
    serial:document.getElementById('f_serial').value.trim(),
    mac:document.getElementById('f_mac').value.trim(),
    account:document.getElementById('f_account').value.trim(),
    orgid:document.getElementById('f_orgid').value.trim(),
    sname:document.getElementById('f_sname').value.trim(),
    comment:document.getElementById('f_comment').value.trim()
  };
  const submitBtn=document.getElementById('submitAdd');
  submitBtn.disabled=true;
  try{
    await addDoc(devicesCol, newRow);
    ['f_device','f_soc','f_ip','f_serial','f_mac','f_account','f_orgid','f_sname','f_comment'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f_env').value='';
    document.getElementById('f_compat').checked=false;
    addForm.classList.remove('open');
  }catch(err){
    alert('추가 실패: '+err.message);
  }finally{
    submitBtn.disabled=false;
  }
});


seedIfEmpty().then(()=>{
  onSnapshot(devicesCol, (snap)=>{
    rows = snap.docs.map(d=>({_id:d.id, ...d.data()}));
    populateSocOptions();
    renderStats();
    render();
  }, (err)=>{
    tbody.innerHTML='';
    empty.style.display='block';
    empty.textContent='데이터를 불러오지 못했습니다: '+err.message;
  });
}).catch(err=>{
  tbody.innerHTML='';
  empty.style.display='block';
  empty.textContent='초기 데이터 로드 실패: '+err.message;
});
</script>
